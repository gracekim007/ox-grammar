<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>OX 문법 · 단어장</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <noscript>이 앱은 자바스크립트가 필요합니다.</noscript>

  <header class="app-header">
    <button id="nav-back" class="icon-btn" aria-label="뒤로" title="뒤로">←</button>
    <div class="header-title">
      <div class="app-name">OX 문법 · 단어장</div>
      <div id="header-subtitle" class="subtitle"></div>
    </div>
    <button id="nav-menu" class="icon-btn" aria-label="메뉴" title="메뉴">☰</button>
  </header>

  <nav id="drawer" class="drawer hidden" aria-label="메뉴">
    <div class="drawer-inner">
      <button class="drawer-item" data-nav="#/">홈</button>
      <button class="drawer-item" data-nav="#/import">가져오기/내보내기</button>
      <button class="drawer-item" data-nav="#/about">도움말</button>
      <div class="drawer-sep"></div>
      <button id="btn-reset" class="drawer-item danger">전체 초기화</button>
      <div class="drawer-foot">오프라인 저장 · PWA</div>
    </div>
  </nav>

  <main id="app" class="app-main"></main>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister().catch(() => {})));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
      }
    } catch (e) {}
  })();

  window.addEventListener('error', function (e) {
    const app = document.getElementById('app');
    if (!app) return;
    if (app.innerHTML && app.innerHTML.trim()) return;
    app.innerHTML = '<div class="card" style="margin:12px;">앱 스크립트 로딩 중 오류가 발생했습니다.<br>이 페이지를 완전히 새로고침하거나, 브라우저 탭을 닫고 다시 열어주세요.<br><span style="font-size:12px;color:#666;">' + String(e.message || 'unknown error') + '</span></div>';
  });
</script>
<script type="module" src="./app-v16.js?v=16"></script>
</body>
</html>
